name: Test, build, and deploy roadbooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Build roadbook collection
        run: |
          python skills/personal-travel-roadbook/scripts/build_site.py \
            --config site.config.json \
            --input roadbooks \
            --out dist
      - name: Verify migrated route count
        run: |
          test "$(find dist/routes -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "11"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
